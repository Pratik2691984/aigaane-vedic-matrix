<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aigaane.in | Navrasa Timeline Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#080E18; --secondary:#111C2E; --surface:#18263E;
  --accent:#D4AF37; --accent-dim:rgba(212,175,55,.15); --accent-glow:rgba(212,175,55,.35);
  --text-main:#F0F4F8; --text-dim:#94A3B8; --border-ui:rgba(212,175,55,.22);
  --font-display:'Cinzel',serif; --font-sanskrit:'Noto Serif',serif;
  --font-sans:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --c-shringara:#F472B6; --c-hasya:#FBBF24; --c-karuna:#60A5FA; --c-raudra:#F87171;
  --c-veera:#FB923C; --c-bhayanaka:#A855F7; --c-bibhatsa:#4ADE80; --c-adbhuta:#38BDF8; --c-shanta:#E2E8F0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--primary);color:var(--text-main);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.app-header{background:linear-gradient(180deg,var(--secondary) 0%,rgba(8,14,24,.95) 100%);border-bottom:1px solid var(--border-ui);padding:12px 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px)}
.header-content{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(160px,auto) 1fr;align-items:center;gap:16px}
@media (max-width:840px){.header-content{grid-template-columns:1fr}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-emblem{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#785A14);color:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;box-shadow:0 0 14px var(--accent-glow)}
.brand-title{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.75px}
.brand-title span{color:var(--accent)}
.controls-cluster{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap}
.model-tabs{display:flex;background:rgba(0,0,0,.4);padding:3px;border-radius:8px;border:1px solid var(--border-ui)}
.model-tab{padding:6px 14px;border:none;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;border-radius:6px}
.model-tab.active{background:var(--accent);color:var(--primary)}
.date-stepper{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px;border:1px solid var(--border-ui)}
.nav-btn,.date-picker-trigger{background:none;border:none;color:var(--text-main);cursor:pointer;padding:2px 8px}
.date-display{font-family:var(--font-mono);font-size:13px;font-weight:600}
.workspace{max-width:1400px;margin:0 auto;padding:24px;width:100%;display:flex;flex-direction:column;gap:24px}
.rasa-vector-board{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media (max-width:1100px){.rasa-vector-board{grid-template-columns:repeat(5,1fr)}}
@media (max-width:680px){.rasa-vector-board{grid-template-columns:repeat(3,1fr)}}
.rasa-cell{background:var(--surface);border:1px solid var(--border-ui);border-radius:8px;padding:10px}
.rasa-cell-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.rasa-cell-val{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.rasa-progress{height:4px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden;margin-top:4px}
.rasa-bar{height:100%;width:0}
.timeline-stream{display:flex;flex-direction:column;gap:12px}
.panel-row{background:var(--surface);border:1px solid var(--border-ui);border-left:4px solid var(--accent);border-radius:8px;padding:16px 20px;display:grid;grid-template-columns:80px 1fr 220px;gap:16px;align-items:center;cursor:pointer}
.panel-row:hover,.panel-row.playing{border-color:var(--accent);background:#1C2D4A}
.panel-seq{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.panel-act{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.dialogue-verse{font-family:var(--font-sanskrit);font-size:17px}
.dialogue-trans{font-size:13px;color:var(--text-dim);line-height:1.4}
.meter-container{display:flex;align-items:center;gap:8px;margin-top:4px}
.meter-scansion{font-family:var(--font-mono);letter-spacing:2px;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px}
.m-guru{color:#F472B6}.m-laghu{color:#38BDF8}
.badge-rasa{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--border-ui)}
.panel-metrics-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.bpm-tag{color:var(--accent);font-weight:600;font-size:12px}
.action-hub{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:16px;background:var(--secondary);border:1px solid var(--border-ui);border-radius:8px}
.btn-set{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--surface);color:var(--text-main);border:1px solid var(--border-ui);font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;cursor:pointer}
.btn-accent{background:var(--accent);color:var(--primary);border-color:var(--accent)}
.audio-playback-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);font-family:var(--font-mono)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
@media (max-width:840px){.panel-row{grid-template-columns:1fr}.panel-metrics-col{align-items:flex-start}}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-content">
    <a href="/" class="brand">
      <div class="brand-emblem">अ</div>
      <div class="brand-title">aigaane<span>.in</span> // Navrasa</div>
    </a>
    <div class="controls-cluster">
      <div class="model-tabs" id="modelTabs">
        <button class="model-tab active" data-model="gemini">Gemini 2.5</button>
        <button class="model-tab" data-model="grok">Grok β</button>
        <button class="model-tab" data-model="hybrid">Unified</button>
      </div>
      <div class="date-stepper">
        <button class="nav-btn" id="btnPrevDay">‹</button>
        <span class="date-display" id="lblDateDisplay">2026-09-08</span>
        <button class="nav-btn" id="btnNextDay">›</button>
        <input type="date" id="nativeDatePicker" style="display:none" value="2026-09-08">
        <button class="date-picker-trigger" id="btnCalendar">📅</button>
      </div>
    </div>
  </div>
</header>
<main class="workspace">
  <section class="rasa-vector-board" id="rasaBoard"></section>
  <section class="timeline-stream" id="timelineStream"></section>
  <footer class="action-hub">
    <div class="audio-playback-indicator">
      <div class="status-dot"></div>
      <span id="txtEngineStatus">Pingala engine ready · metrics locked 16-13-18-16-7</span>
    </div>
    <div class="btn-set">
      <button class="btn" id="btnExportJson">Export Manifest</button>
      <button class="btn btn-accent" id="btnTriggerReel">Build Reel</button>
    </div>
  </footer>
</main>
<script>
const NAVRASA_META = [
  {id:'shringara',name:'Srngara',color:'var(--c-shringara)'},
  {id:'hasya',name:'Hasya',color:'var(--c-hasya)'},
  {id:'karuna',name:'Karuna',color:'var(--c-karuna)'},
  {id:'raudra',name:'Raudra',color:'var(--c-raudra)'},
  {id:'veera',name:'Vira',color:'var(--c-veera)'},
  {id:'bhayanaka',name:'Bhayanaka',color:'var(--c-bhayanaka)'},
  {id:'bibhatsa',name:'Bibhatsa',color:'var(--c-bibhatsa)'},
  {id:'adbhuta',name:'Adbhuta',color:'var(--c-adbhuta)'},
  {id:'shanta',name:'Santa',color:'var(--c-shanta)'}
];
const PANEL_LOCK = [
  {index:1,act:'Setup',rasa:'Bhayanaka',meter:'GGGGGGGG',syllables:8,matras:16,bpm:72},
  {index:2,act:'Rise',rasa:'Hasya',meter:'GGLGGLGL',syllables:8,matras:13,bpm:96},
  {index:3,act:'Climax',rasa:'Karuna',meter:'GLGLGLGLGLGL',syllables:12,matras:18,bpm:128},
  {index:4,act:'Decel',rasa:'Vira',meter:'GLLGLLGLLGG',syllables:11,matras:16,bpm:100},
  {index:5,act:'Settle',rasa:'Santa',meter:'LLLLLLL',syllables:7,matras:7,bpm:60}
];
function scanMatras(meter){return meter.split('').reduce((s,c)=>s+(c==='G'?2:1),0)}
function assertLock(p, lock){
  return p.meter===lock.meter && p.syllables===lock.syllables && p.matras===lock.matras && scanMatras(p.meter)===lock.matras;
}
const CANONICAL = {
  headline:'AI Existential Bounds vs Frontier Space Ascendance',
  distribution:{shringara:0.10,hasya:0.18,karuna:0.15,raudra:0.08,veera:0.17,bhayanaka:0.16,bibhatsa:0.02,adbhuta:0.08,shanta:0.06},
  panels:[
    {...PANEL_LOCK[0],verse:'ghoram ghoram netram pasyet',trans:'Darkness and terror, the digital eye beholds.'},
    {...PANEL_LOCK[1],verse:'hartum na sakyam vittam ca',trans:'The liquidity vanished, yet greed remains.'},
    {...PANEL_LOCK[2],verse:'gitam sada mriyate na kadapi',trans:'The voice endures through timeless resonance.'},
    {...PANEL_LOCK[3],verse:'dhavatu dhavatu laksya-samipam',trans:'Charging forward to conquer the victory line.'},
    {...PANEL_LOCK[4],verse:'jagati samatara',trans:'Equilibrium restores all fleeting forms.'}
  ]
};
class MeterVoice{
  constructor(){this.ctx=null}
  init(){
    if(!this.ctx){
      const A=window.AudioContext||window.webkitAudioContext;
      this.ctx=new A();
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  }
  play(meter,bpm,base=240){
    this.init();
    const beat=60/bpm;
    let t=this.ctx.currentTime+0.02;
    for(const ch of meter){
      const dur=ch==='G'?beat*2:beat;
      const osc=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      osc.type='sine';
      osc.frequency.value=ch==='G'?base*1.5:base;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.28,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.9);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t+dur);
      t+=dur;
    }
    return (t-this.ctx.currentTime)*1000;
  }
}
class NavrasaApp{
  constructor(){
    this.date='2026-09-08'; this.model='gemini'; this.cache={}; this.voice=new MeterVoice();
    this.dom={
      dateLabel:document.getElementById('lblDateDisplay'),
      datePicker:document.getElementById('nativeDatePicker'),
      btnPrev:document.getElementById('btnPrevDay'),
      btnNext:document.getElementById('btnNextDay'),
      btnCalendar:document.getElementById('btnCalendar'),
      modelTabs:document.getElementById('modelTabs'),
      rasaBoard:document.getElementById('rasaBoard'),
      timelineStream:document.getElementById('timelineStream'),
      btnExport:document.getElementById('btnExportJson'),
      btnBuild:document.getElementById('btnTriggerReel'),
      engineStatus:document.getElementById('txtEngineStatus')
    };
    this.initListeners();
    this.loadDate(this.date);
  }
  initListeners(){
    this.dom.btnPrev.addEventListener('click',()=>this.shiftDate(-1));
    this.dom.btnNext.addEventListener('click',()=>this.shiftDate(1));
    this.dom.btnCalendar.addEventListener('click',()=>this.dom.datePicker.showPicker());
    this.dom.datePicker.addEventListener('change',e=>this.loadDate(e.target.value));
    this.dom.modelTabs.addEventListener('click',e=>{
      const btn=e.target.closest('.model-tab'); if(!btn) return;
      this.dom.modelTabs.querySelectorAll('.model-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); this.model=btn.dataset.model; this.loadDate(this.date);
    });
    this.dom.btnExport.addEventListener('click',()=>this.exportCurrentPayload());
    this.dom.btnBuild.addEventListener('click',()=>this.triggerRemoteBuild());
  }
  shiftDate(days){const d=new Date(this.date+'T00:00:00'); d.setDate(d.getDate()+days); this.loadDate(d.toISOString().slice(0,10))}
  lockPanels(panels){
    return PANEL_LOCK.map((lock,i)=>({
      ...lock,
      verse:(panels[i]&&panels[i].verse)||CANONICAL.panels[i].verse,
      trans:(panels[i]&&panels[i].trans)||CANONICAL.panels[i].trans
    }));
  }
  async loadDate(dateStr){
    this.date=dateStr;
    this.dom.dateLabel.textContent=dateStr;
    this.dom.datePicker.value=dateStr;
    if(this.cache[dateStr]){this.render(this.cache[dateStr]); return}
    try{
      const res=await fetch('/dist_'+dateStr+'/payload_'+dateStr+'.json');
      if(res.ok){
        const payload=this.normalizeBackendPayload(await res.json());
        this.cache[dateStr]=payload; this.render(payload); return;
      }
    }catch(e){}
    const payload=dateStr==='2026-09-08'?{...CANONICAL,panels:this.lockPanels(CANONICAL.panels)}:this.synthesizeMathematicalFallback(dateStr);
    this.cache[dateStr]=payload; this.render(payload);
  }
  normalizeBackendPayload(payload){
    const raw=payload.panels||[];
    return {
      headline:payload.headline_essence||payload.headline||('Daily Signal Archive // '+this.date),
      distribution:payload.distribution||CANONICAL.distribution,
      panels:this.lockPanels(raw.map(p=>({verse:p.dialogue||p.verse, trans:p.visual_action||p.trans})))
    };
  }
  synthesizeMathematicalFallback(dateStr){
    return {headline:'Daily Signal Archive // '+dateStr, distribution:CANONICAL.distribution, panels:this.lockPanels(CANONICAL.panels)};
  }
  render(data){
    const ok=data.panels.every((p,i)=>assertLock(p,PANEL_LOCK[i]));
    this.dom.engineStatus.textContent=ok
      ? 'Pingala engine in-sync · L=0 · 16-13-18-16-7 matra'
      : 'Validation failed: meter lock broken';
    this.renderVectorBoard(data.distribution);
    this.renderPanels(data.panels);
  }
  renderVectorBoard(dist){
    this.dom.rasaBoard.innerHTML=NAVRASA_META.map(meta=>{
      const pct=Math.round((dist[meta.id]||0.05)*100);
      return '<div class="rasa-cell"><div class="rasa-cell-top"><span>'+meta.name+'</span><span class="rasa-cell-val">'+pct+'%</span></div><div class="rasa-progress"><div class="rasa-bar" style="width:'+Math.min(100,pct*3)+'%;background:'+meta.color+'"></div></div></div>';
    }).join('');
  }
  renderPanels(panels){
    this.dom.timelineStream.innerHTML=panels.map(p=>{
      const scan=p.meter.split('').map(w=>w==='G'?'<span class="m-guru">G</span>':'<span class="m-laghu">L</span>').join('');
      return '<div class="panel-row" data-index="'+p.index+'"><div class="panel-meta"><div class="panel-seq">0'+p.index+'</div><div class="panel-act">'+p.act+'</div></div><div class="panel-body"><div class="dialogue-verse">'+p.verse+'</div><div class="dialogue-trans">'+p.trans+'</div><div class="meter-container"><span class="badge-rasa">'+p.rasa+'</span><div class="meter-scansion">'+scan+'</div></div></div><div class="panel-metrics-col"><span class="bpm-tag">'+p.bpm+' BPM</span><span>'+p.syllables+' aksaras</span><span>'+p.matras+' matras</span></div></div>';
    }).join('');
    this.dom.timelineStream.querySelectorAll('.panel-row').forEach(row=>{
      row.addEventListener('click',()=>{
        const i=+row.dataset.index-1;
        const p=this.cache[this.date].panels[i];
        this.playPanel(p,row);
      });
    });
  }
  playPanel(p,row){
    this.dom.timelineStream.querySelectorAll('.panel-row').forEach(r=>r.classList.remove('playing'));
    if(row) row.classList.add('playing');
    const ms=this.voice.play(p.meter,p.bpm);
    this.dom.engineStatus.textContent='Playing panel '+p.index+' · '+p.rasa+' · '+p.bpm+' BPM · '+p.matras+' matra';
    setTimeout(()=>row&&row.classList.remove('playing'), ms);
  }
  exportCurrentPayload(){
    const data=this.cache[this.date];
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='navrasa_manifest_'+this.date+'.json'; a.click();
    URL.revokeObjectURL(url);
  }
  async triggerRemoteBuild(){
    this.dom.engineStatus.textContent='Trying /api/build-reel …';
    try{
      const res=await fetch('/api/build-reel?date='+this.date,{method:'POST'});
      if(res.ok){ this.dom.engineStatus.textContent='Server build queued.'; return; }
    }catch(e){}
    this.dom.engineStatus.textContent='Local preview: playing 5-panel metre reel';
    this.playReel();
  }
  async playReel(){
    const panels=this.cache[this.date].panels;
    for(const p of panels){
      const row=this.dom.timelineStream.querySelector('[data-index="'+p.index+'"]');
      const ms=this.voice.play(p.meter,p.bpm);
      if(row){ this.dom.timelineStream.querySelectorAll('.panel-row').forEach(r=>r.classList.remove('playing')); row.classList.add('playing'); }
      this.dom.engineStatus.textContent='Reel '+p.index+'/5 · '+p.meter+' · '+p.bpm+' BPM';
      await new Promise(r=>setTimeout(r, ms+120));
    }
    this.dom.engineStatus.textContent='Local reel complete · FFmpeg hook ready at POST /api/build-reel';
  }
}
document.addEventListener('DOMContentLoaded',()=>new NavrasaApp());
</script>
</body>
</html>
