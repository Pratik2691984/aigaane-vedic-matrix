<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aigaane.in | Navrasa Dynamic Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#080E18;--secondary:#111C2E;--surface:#18263E;--surface-card:#142034;--accent:#D4AF37;--accent-dim:rgba(212,175,55,.15);--text-main:#F0F4F8;--text-dim:#94A3B8;--border-ui:rgba(212,175,55,.22);--font-display:Cinzel,serif;--font-sanskrit:"Noto Serif",serif;--font-sans:Inter,sans-serif;--font-mono:"JetBrains Mono",monospace;--c-shringara:#F472B6;--c-hasya:#FBBF24;--c-karuna:#60A5FA;--c-raudra:#F87171;--c-veera:#FB923C;--c-bhayanaka:#A855F7;--c-bibhatsa:#4ADE80;--c-adbhuta:#38BDF8;--c-shanta:#E2E8F0}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--primary);color:var(--text-main);font-family:var(--font-sans);min-height:100vh}
.app-header{background:var(--secondary);border-bottom:1px solid var(--border-ui);padding:14px 24px;position:sticky;top:0;z-index:20}
.header-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}
.brand-emblem{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#785A14);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.brand-title{font-family:var(--font-display);font-weight:700}.brand-title span{color:var(--accent)}
.controls-cluster,.model-tabs,.date-stepper,.btn-set,.prompt-category-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.model-tab,.tab-btn,.btn,.nav-btn,.date-picker-trigger,.btn-copy{cursor:pointer;border:1px solid var(--border-ui);background:var(--surface);color:var(--text-main);border-radius:6px;padding:6px 12px}
.model-tab.active,.tab-btn.active,.btn-accent{background:var(--accent);color:var(--primary);border-color:var(--accent)}
.date-display,.headline-date,.status-telemetry,.prompt-text,.full-prompt-area,.bpm-tag,.rasa-cell-val{font-family:var(--font-mono)}
.workspace{max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.headline-card,.panel-row,.full-prompts-section,.action-hub,.rasa-cell{background:var(--surface);border:1px solid var(--border-ui);border-radius:8px;padding:14px}
.headline-card{border-left:4px solid var(--accent);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rasa-vector-board{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media(max-width:1100px){.rasa-vector-board{grid-template-columns:repeat(5,1fr)}}
@media(max-width:680px){.rasa-vector-board{grid-template-columns:repeat(3,1fr)}}
.rasa-cell-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.rasa-cell-val{color:var(--accent);font-weight:700}
.rasa-progress{height:4px;background:#0006;margin-top:6px;border-radius:2px;overflow:hidden}
.rasa-bar{height:100%}
.panel-header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #fff1;padding-bottom:8px}
.panel-seq{font-family:var(--font-display);color:var(--accent);font-weight:700}
.panel-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:800px){.panel-body{grid-template-columns:1fr}}
.dialogue-verse{font-family:var(--font-sanskrit);font-size:17px;font-weight:600}
.dialogue-trans{color:var(--text-dim);font-size:13px}
.meter-scansion{letter-spacing:2px;font-family:var(--font-mono);font-weight:700}
.m-guru{color:#F472B6}.m-laghu{color:#38BDF8}
.prompt-box{background:#0006;padding:10px;border-radius:6px}
.prompt-title-row{display:flex;justify-content:space-between;align-items:center}
.prompt-label{color:var(--accent);font-size:11px;text-transform:uppercase;font-weight:700}
.full-prompt-area{background:#090F19;padding:12px;white-space:pre-wrap;max-height:250px;overflow:auto;font-size:12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block}
</style></head>
<body>
<header class="app-header"><div class="header-content">
<a class="brand" href="#"><div class="brand-emblem">अ</div><div class="brand-title">aigaane<span>.in</span> // Navrasa Dynamic Prompts</div></a>
<div class="controls-cluster">
<div class="model-tabs" id="modelTabs">
<button class="model-tab active" data-model="gemini">Gemini 2.5</button>
<button class="model-tab" data-model="grok">Grok</button>
<button class="model-tab" data-model="hybrid">Unified</button>
</div>
<div class="date-stepper">
<button class="nav-btn" id="btnPrevDay">‹</button>
<span class="date-display" id="lblDateDisplay">2026-09-08</span>
<button class="nav-btn" id="btnNextDay">›</button>
<input type="date" id="nativeDatePicker" style="display:none" value="2026-09-08">
<button class="date-picker-trigger" id="btnCalendar">Date</button>
</div></div></div></header>
<main class="workspace">
<section class="headline-card"><div id="headlineText">Loading</div><div class="headline-date" id="headlineDate">2026-09-08</div></section>
<section class="rasa-vector-board" id="rasaBoard"></section>
<section id="timelineStream"></section>
<section class="full-prompts-section">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
<div style="color:var(--accent);font-weight:700">Social and engine prompts</div>
<div class="prompt-category-tabs" id="promptCategoryTabs">
<button class="tab-btn active" data-type="facebook">Facebook</button>
<button class="tab-btn" data-type="twitter">X thread</button>
<button class="tab-btn" data-type="midjourney">Midjourney</button>
<button class="tab-btn" data-type="json">JSON</button>
</div></div>
<div class="full-prompt-area" id="txtFullPrompt"></div>
<div style="text-align:right"><button class="btn btn-accent" id="btnCopyMasterPrompt">Copy master prompt</button></div>
</section>
<footer class="action-hub" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
<div class="status-telemetry"><span class="status-dot"></span> <span id="txtEngineStatus">L=0</span></div>
<div class="btn-set"><button class="btn" id="btnExportJson">Export</button><button class="btn btn-accent" id="btnTriggerAudio">Play metric pulse</button></div>
</footer>
</main>
<script>
const NAVRASA_META=[{id:"shringara",name:"Srngara",color:"var(--c-shringara)"},{id:"hasya",name:"Hasya",color:"var(--c-hasya)"},{id:"karuna",name:"Karuna",color:"var(--c-karuna)"},{id:"raudra",name:"Raudra",color:"var(--c-raudra)"},{id:"veera",name:"Vira",color:"var(--c-veera)"},{id:"bhayanaka",name:"Bhayanaka",color:"var(--c-bhayanaka)"},{id:"bibhatsa",name:"Bibhatsa",color:"var(--c-bibhatsa)"},{id:"adbhuta",name:"Adbhuta",color:"var(--c-adbhuta)"},{id:"shanta",name:"Santa",color:"var(--c-shanta)"}];
const PANEL_LOCK=[{index:1,act:"Setup",rasa:"Bhayanaka",meter:"GGGGGGGG",syllables:8,matras:16,bpm:72,verse:"ghoram ghoram netram pasyet"},{index:2,act:"Rise",rasa:"Hasya",meter:"GGLGGLGL",syllables:8,matras:13,bpm:96,verse:"hartum na sakyam vittam ca"},{index:3,act:"Climax",rasa:"Karuna",meter:"GLGLGLGLGLGL",syllables:12,matras:18,bpm:128,verse:"gitam sada mriyate na kadapi"},{index:4,act:"Decel",rasa:"Vira",meter:"GLLGLLGLLGG",syllables:11,matras:16,bpm:100,verse:"dhavatu dhavatu laksya-samipam"},{index:5,act:"Settle",rasa:"Santa",meter:"LLLLLLL",syllables:7,matras:7,bpm:60,verse:"jagati samatara"}];
const DATE_THEMES={"2026-09-08":{headline:"AI Existential Bounds vs Frontier Space Ascendance",distribution:{shringara:0.08,hasya:0.18,karuna:0.16,raudra:0.10,veera:0.18,bhayanaka:0.16,bibhatsa:0.02,adbhuta:0.08,shanta:0.04},panels:PANEL_LOCK.map((lock,i)=>Object.assign({},lock,[{trans:"UN warns of existential frontier thresholds.",imagePrompt:"cyberpunk control room watcher 8k --ar 9:16"},{trans:"Flash liquidity glitch shakes the auction coffer.",imagePrompt:"satirical ticker tape --ar 9:16"},{trans:"Playback voice outlasts mortality.",imagePrompt:"golden acoustic silhouette --ar 9:16"},{trans:"Baseline sprint into the quarterfinals.",imagePrompt:"athletic forehand stadium lights --ar 9:16"},{trans:"Orbital constellation restores equilibrium.",imagePrompt:"earth from orbit sunrise --ar 9:16"}][i]))}};
function scan(m){return m.split("").reduce((s,c)=>s+(c==="G"?2:1),0)}
function lockOk(panels){return panels.every((p,i)=>p.meter===PANEL_LOCK[i].meter&&p.matras===PANEL_LOCK[i].matras&&p.syllables===PANEL_LOCK[i].syllables&&scan(p.meter)===PANEL_LOCK[i].matras)}
function seedDist(dateStr){const seed=dateStr.split("-").reduce((a,p)=>a+parseInt(p,10),0);const raw=NAVRASA_META.map((_,i)=>Math.abs(Math.sin(seed*(i+1)*0.73))+0.08);const sum=raw.reduce((a,b)=>a+b,0);const dist={};NAVRASA_META.forEach((m,i)=>dist[m.id]=+(raw[i]/sum).toFixed(3));const acc=Object.values(dist).reduce((a,b)=>a+b,0);dist.shanta=+(dist.shanta+(1-acc)).toFixed(3);return {seed,dist}}
function resolvePayload(dateStr){if(DATE_THEMES[dateStr])return DATE_THEMES[dateStr];const {seed,dist}=seedDist(dateStr);const trans=["Threshold warning.","Algorithmic absurdity.","Timeless resonance.","Target sprint.","Universal calm."];return {headline:"Global Signals // #"+seed+" // "+dateStr,distribution:dist,panels:PANEL_LOCK.map((lock,i)=>Object.assign({},lock,{trans:trans[i]+" ("+dateStr+")",imagePrompt:"Navrasa panel "+(i+1)+" "+lock.rasa+" "+dateStr+" --ar 9:16"}))}}
class NavrasaController{constructor(){this.date="2026-09-08";this.model="gemini";this.activePromptType="facebook";this.currentPayload=null;this.dom={dateLabel:lblDateDisplay,datePicker:nativeDatePicker,btnPrev:btnPrevDay,btnNext:btnNextDay,btnCalendar:btnCalendar,modelTabs,headlineText,headlineDate,rasaBoard,timelineStream,txtFullPrompt,promptTabs:promptCategoryTabs,btnCopyMaster:btnCopyMasterPrompt,btnExport:btnExportJson,btnTriggerAudio,engineStatus:txtEngineStatus};this.init();this.loadDate(this.date)}init(){this.dom.btnPrev.onclick=()=>this.shift(-1);this.dom.btnNext.onclick=()=>this.shift(1);this.dom.btnCalendar.onclick=()=>this.dom.datePicker.showPicker();this.dom.datePicker.onchange=e=>this.loadDate(e.target.value);this.dom.modelTabs.onclick=e=>{const b=e.target.closest(".model-tab");if(!b)return;this.dom.modelTabs.querySelectorAll(".model-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");this.model=b.dataset.model;this.renderFullPrompt()};this.dom.promptTabs.onclick=e=>{const b=e.target.closest(".tab-btn");if(!b)return;this.dom.promptTabs.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");this.activePromptType=b.dataset.type;this.renderFullPrompt()};this.dom.btnCopyMaster.onclick=()=>{navigator.clipboard.writeText(this.dom.txtFullPrompt.textContent)};this.dom.btnExport.onclick=()=>this.exportJson();this.dom.btnTriggerAudio.onclick=()=>this.playPulse()}shift(d){const x=new Date(this.date+"T00:00:00");x.setDate(x.getDate()+d);this.loadDate(x.toISOString().slice(0,10))}loadDate(dateStr){this.date=dateStr;this.dom.dateLabel.textContent=dateStr;this.dom.datePicker.value=dateStr;this.dom.headlineDate.textContent=dateStr;this.currentPayload=resolvePayload(dateStr);this.render()}render(){const data=this.currentPayload;this.dom.headlineText.textContent=data.headline;this.dom.engineStatus.textContent=lockOk(data.panels)?"Metric lock L=0 · 16-13-18-16-7 · "+this.date:"LOCK BROKEN";this.dom.rasaBoard.innerHTML=NAVRASA_META.map(m=>{const pct=((data.distribution[m.id]||0)*100).toFixed(1);return '<div class="rasa-cell"><div class="rasa-cell-top"><span>'+m.name+'</span><span class="rasa-cell-val">'+pct+'%</span></div><div class="rasa-progress"><div class="rasa-bar" style="width:'+pct+'%;background:'+m.color+'"></div></div></div>'}).join("");this.dom.timelineStream.innerHTML=data.panels.map(p=>{const scanH=p.meter.split("").map(w=>w==="G"?'<span class="m-guru">G</span>':'<span class="m-laghu">L</span>').join("");return '<div class="panel-row" data-index="'+p.index+'"><div class="panel-header"><span class="panel-seq">#0'+p.index+'</span><span>'+p.act+' · '+p.rasa+'</span><span class="bpm-tag">'+p.bpm+' BPM · '+p.syllables+' aksara · '+p.matras+' matra</span></div><div class="panel-body"><div><div class="dialogue-verse">'+p.verse+'</div><div class="dialogue-trans">'+p.trans+'</div><div class="meter-scansion">'+scanH+'</div></div><div class="prompt-box"><div class="prompt-title-row"><span class="prompt-label">Image prompt</span><button class="btn-copy" data-copy="'+encodeURIComponent(p.imagePrompt)+'">Copy</button></div><div class="prompt-text">'+p.imagePrompt+'</div></div></div></div>'}).join("");this.dom.timelineStream.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)));this.dom.timelineStream.querySelectorAll(".panel-row").forEach(row=>row.addEventListener("click",e=>{if(e.target.closest(".btn-copy"))return;this.playOne(this.currentPayload.panels[+row.dataset.index-1])}));this.renderFullPrompt()}renderFullPrompt(){const data=this.currentPayload;let text="";if(this.activePromptType==="facebook")text="DAILY SIGNAL // "+this.date+"\n\n"+data.headline+"\n\n"+data.panels.map(p=>"Panel "+p.index+" ["+p.rasa+"]: "+p.verse+" — "+p.trans).join("\n")+"\n\nL=0 16-13-18-16-7 model="+this.model;else if(this.activePromptType==="twitter")text="1/6 "+this.date+"\n"+data.headline+"\n\n"+data.panels.map(p=>p.index+"/ ["+p.rasa+"] "+p.trans+" ("+p.bpm+" BPM)").join("\n\n");else if(this.activePromptType==="midjourney")text=data.panels.map(p=>"/imagine prompt: "+p.imagePrompt).join("\n\n");else text=JSON.stringify(data,null,2);this.dom.txtFullPrompt.textContent=text}playOne(p){const ctx=new (window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime+0.02;const beat=60/p.bpm;p.meter.split("").forEach(ch=>{const g=ch==="G";const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=g?330:220;const dur=g?beat*0.9:beat*0.5;gain.gain.setValueAtTime(0.12,t);gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+dur);t+=dur+(g?beat*0.1:beat*0.5)});this.dom.engineStatus.textContent="Playing panel "+p.index}playPulse(){const ctx=new (window.AudioContext||window.webkitAudioContext)();let cursor=ctx.currentTime+0.05;this.currentPayload.panels.forEach(p=>{const beat=60/p.bpm;p.meter.split("").forEach(ch=>{const g=ch==="G";const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=g?330:220;const dur=g?beat*0.9:beat*0.5;gain.gain.setValueAtTime(0.12,cursor);gain.gain.exponentialRampToValueAtTime(0.0001,cursor+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start(cursor);osc.stop(cursor+dur);cursor+=dur+(g?beat*0.1:beat*0.5)});cursor+=beat*1.2});this.dom.engineStatus.textContent="Playing 5-act pulse"}exportJson(){const blob=new Blob([JSON.stringify(this.currentPayload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="navrasa_"+this.date+".json";a.click();URL.revokeObjectURL(url)}}
document.addEventListener("DOMContentLoaded",()=>new NavrasaController());
</script></body></html>
