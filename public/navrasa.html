<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aigaane.in | Global Signals & Grok Synchronizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#080E18;--secondary:#111C2E;--surface:#18263E;--surface-card:#142034;--accent:#D4AF37;--accent-dim:rgba(212,175,55,.15);--text-main:#F0F4F8;--text-dim:#94A3B8;--border-ui:rgba(212,175,55,.22);--font-display:Cinzel,serif;--font-sanskrit:"Noto Serif",serif;--font-sans:Inter,sans-serif;--font-mono:"JetBrains Mono",monospace;--c-shringara:#F472B6;--c-hasya:#FBBF24;--c-karuna:#60A5FA;--c-raudra:#F87171;--c-veera:#FB923C;--c-bhayanaka:#A855F7;--c-bibhatsa:#4ADE80;--c-adbhuta:#38BDF8;--c-shanta:#E2E8F0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--primary);color:var(--text-main);font-family:var(--font-sans);min-height:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.app-header{background:var(--secondary);border-bottom:1px solid var(--border-ui);padding:12px 16px;position:sticky;top:0;z-index:100}
.header-content{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-emblem{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#785A14);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.brand-title{font-family:var(--font-display);font-size:16px;font-weight:700}.brand-title span{color:var(--accent)}
.date-stepper{display:flex;align-items:center;background:#0008;padding:2px 8px;border-radius:8px;border:1px solid var(--border-ui);min-height:44px}
.nav-btn,.date-picker-trigger,.btn,.tab-btn,.btn-copy{min-width:44px;min-height:44px;border:1px solid var(--border-ui);background:var(--surface);color:var(--text-main);border-radius:6px;cursor:pointer;font-weight:600}
.nav-btn,.date-picker-trigger{border:0;background:0;font-size:20px}
.date-display{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:0 6px}
.workspace{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.headline-card,.panel-row,.master-prompt-section,.action-hub,.rasa-cell{background:var(--surface);border:1px solid var(--border-ui);border-radius:8px;padding:14px}
.headline-card{border-left:4px solid var(--accent);background:var(--surface-card)}
.headline-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seed-tag{font-family:var(--font-mono);font-size:11px;color:var(--accent);padding:3px 8px;background:var(--accent-dim);border-radius:4px}
.rasa-vector-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
@media(max-width:600px){.rasa-vector-board{grid-template-columns:repeat(3,1fr)}}
.rasa-cell-top{display:flex;justify-content:space-between;font-size:11px;font-weight:600}
.rasa-cell-val{font-family:var(--font-mono);color:var(--accent)}
.rasa-progress{height:4px;background:#0006;border-radius:2px;overflow:hidden}
.rasa-bar{height:100%}
.panel-header,.prompt-title-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.panel-seq{font-family:var(--font-display);color:var(--accent);font-weight:700}
.panel-body{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.panel-body{grid-template-columns:1fr}}
.dialogue-verse{font-family:var(--font-sanskrit);font-size:16px;font-weight:600}
.dialogue-trans{font-size:12px;color:var(--text-dim)}
.meter-scansion{font-family:var(--font-mono);letter-spacing:2px;font-weight:700}
.m-guru{color:var(--c-shringara)}.m-laghu{color:var(--c-adbhuta)}
.prompt-box{background:#0006;border-radius:6px;padding:10px}
.tab-btn.active,.btn-accent{background:var(--accent);color:var(--primary);border-color:var(--accent)}
.prompt-tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.full-prompt-area{background:#060B12;border-radius:6px;padding:12px;font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.action-hub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.btn-set{display:flex;gap:8px;width:100%}
@media(min-width:640px){.btn-set{width:auto}}.btn{flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block}
.status-telemetry{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
</style></head>
<body>
<header class="app-header"><div class="header-content">
<a class="brand" href="#"><div class="brand-emblem">अ</div><div class="brand-title">aigaane<span>.in</span> // Grok Sync</div></a>
<div class="date-stepper">
<button class="nav-btn" id="btnPrevDay" aria-label="Previous day">‹</button>
<span class="date-display" id="lblDateDisplay">2026-09-08</span>
<button class="nav-btn" id="btnNextDay" aria-label="Next day">›</button>
<input type="date" id="nativeDatePicker" style="display:none" value="2026-09-08">
<button class="date-picker-trigger" id="btnCalendar" aria-label="Pick date">Date</button>
</div></div></header>
<main class="workspace">
<section class="headline-card"><div class="headline-top"><span class="seed-tag" id="lblSeedTag">Seed</span><span class="seed-tag" id="lblDisplayTag">Display</span></div><div id="headlineText">Loading</div></section>
<section class="rasa-vector-board" id="rasaBoard"></section>
<section id="timelineStream"></section>
<section class="master-prompt-section">
<div style="color:var(--accent);font-weight:700">Master dispatch (5-panel contract)</div>
<div class="prompt-tabs" id="promptCategoryTabs">
<button class="tab-btn active" data-type="asymmetric">Asymmetric 2+3 (16:9)</button>
<button class="tab-btn" data-type="linear">5-across (32:9)</button>
<button class="tab-btn" data-type="grok_json">Grok JSON</button>
<button class="tab-btn" data-type="facebook">Facebook</button>
</div>
<div class="full-prompt-area" id="txtFullPrompt"></div>
<button class="btn btn-accent" id="btnCopyMasterPrompt">Copy active prompt</button>
</section>
<footer class="action-hub">
<div class="status-telemetry"><span class="status-dot"></span> <span id="txtEngineStatus">L=0</span></div>
<div class="btn-set"><button class="btn" id="btnExportJson">Export JSON</button><button class="btn btn-accent" id="btnTriggerAudio">Play metric pulse</button></div>
</footer></main>
<script>
const PRIME={year:7919,month:701,day:101,doy:47,week:13,weekday:7,lunar:19};
const META=[{id:"Shringara",name:"Srngara",color:"var(--c-shringara)"},{id:"Hasya",name:"Hasya",color:"var(--c-hasya)"},{id:"Karuna",name:"Karuna",color:"var(--c-karuna)"},{id:"Raudra",name:"Raudra",color:"var(--c-raudra)"},{id:"Vira",name:"Vira",color:"var(--c-veera)"},{id:"Bhayanaka",name:"Bhayanaka",color:"var(--c-bhayanaka)"},{id:"Bibhatsa",name:"Bibhatsa",color:"var(--c-bibhatsa)"},{id:"Adbhuta",name:"Adbhuta",color:"var(--c-adbhuta)"},{id:"Santa",name:"Santa",color:"var(--c-shanta)"}];
const LOCKED=[{act:1,name:"Setup",rasa:"Bhayanaka",verse:"ghoram ghoram netram pasyet",scansion:"GGGGGGGG",syllables:8,matras:16,bpm:72,scene:"Brutalist hazard bunker, cracked earth, pulsing red alerts."},{act:2,name:"Rise",rasa:"Hasya",verse:"hartum na sakyam vittam ca",scansion:"GGLGGLGL",syllables:8,matras:13,bpm:96,scene:"Glitched neon servers, laughing holographic avatars."},{act:3,name:"Climax",rasa:"Karuna",verse:"gitam sada mriyate na kadapi",scansion:"GLGLGLGLGLGL",syllables:12,matras:18,bpm:128,scene:"Golden gramophone in overgrown temple ruins."},{act:4,name:"Decel",rasa:"Vira",verse:"dhavatu dhavatu laksya-samipam",scansion:"GLLGLLGLLGG",syllables:11,matras:16,bpm:100,scene:"Athletes sprinting salt flats at golden hour."},{act:5,name:"Settle",rasa:"Santa",verse:"jagati samatara",scansion:"LLLLLLL",syllables:7,matras:7,bpm:60,scene:"Meditating figure over still water under the Milky Way."}];
const NEG="--no 6-panel, 2x3 grid, sixth box, duplicate panel, repeated character, extra frame";
function seedOf(dateStr){const [y,m,d]=dateStr.split("-").map(Number);const dt=new Date(y,m-1,d);const doy=Math.floor((dt-new Date(y,0,0))/86400000);const copy=new Date(Date.UTC(y,m-1,d));const dayNum=copy.getUTCDay()||7;copy.setUTCDate(copy.getUTCDate()+4-dayNum);const week=Math.ceil((((copy-new Date(Date.UTC(copy.getUTCFullYear(),0,1)))/86400000)+1)/7);const lunar=doy%29.5;return (y*PRIME.year+m*PRIME.month+d*PRIME.day+doy*PRIME.doy+week*PRIME.week+dt.getDay()*PRIME.weekday+Math.floor(lunar*PRIME.lunar))%4294967296}
function rasas(seed){const phi=(1+Math.sqrt(5))/2;const raw=META.map((_,i)=>Math.sin((seed%100000)*(i+1)*phi+(i*Math.PI)/9)+1);const t=raw.reduce((a,b)=>a+b,0);const d={};META.forEach((m,i)=>d[m.id]=+((raw[i]/t)*100).toFixed(1));return d}
class Sync{constructor(){this.date="2026-09-08";this.tab="asymmetric";this.payload=null;this.bind();this.sync(this.date)}bind(){btnPrevDay.onclick=()=>this.shift(-1);btnNextDay.onclick=()=>this.shift(1);btnCalendar.onclick=()=>nativeDatePicker.showPicker();nativeDatePicker.onchange=e=>this.sync(e.target.value);promptCategoryTabs.onclick=e=>{const b=e.target.closest(".tab-btn");if(!b)return;promptCategoryTabs.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");this.tab=b.dataset.type;this.renderPrompts()};btnCopyMasterPrompt.onclick=()=>navigator.clipboard.writeText(txtFullPrompt.textContent);btnExportJson.onclick=()=>this.exp();btnTriggerAudio.onclick=()=>this.pulse()}shift(n){const [y,m,d]=this.date.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);this.sync(dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"))}sync(dateStr){this.date=dateStr;lblDateDisplay.textContent=dateStr;nativeDatePicker.value=dateStr;const seed=seedOf(dateStr);let headline="Global Signal Synchronized ("+dateStr+")";if(dateStr==="2026-09-08")headline="Asha Bhosle memorial day and AI frontier invariants";if(dateStr==="2026-09-01")headline="Global Signals genesis // algorithm and space-tech divergence";this.payload={date:dateStr,seed,display_tag:"#"+(seed%10000).toString().padStart(4,"0"),headline,distribution:rasas(seed),panels:LOCKED.map(p=>Object.assign({},p,{translation:(p.act===3&&dateStr==="2026-09-08")?"September 8 memorial: melody outlasting mortality.":p.scene}))};this.render()}render(){const data=this.payload;lblSeedTag.textContent="Full seed #"+data.seed;lblDisplayTag.textContent="Display "+data.display_tag;headlineText.textContent=data.headline;txtEngineStatus.textContent="L=0 16-13-18-16-7 · seed "+data.seed;rasaBoard.innerHTML=META.map(m=>{const pct=data.distribution[m.id]||0;return '<div class="rasa-cell"><div class="rasa-cell-top"><span>'+m.name+'</span><span class="rasa-cell-val">'+pct+'%</span></div><div class="rasa-progress"><div class="rasa-bar" style="width:'+Math.min(100,pct)+'%;background:'+m.color+'"></div></div></div>'}).join("");timelineStream.innerHTML=data.panels.map(p=>{const scan=p.scansion.split("").map(c=>c==="G"?'<span class="m-guru">G</span>':'<span class="m-laghu">L</span>').join("");const prompt="/imagine prompt: Panel "+p.act+" of 5 ["+p.name+" - "+p.rasa+"]: "+p.translation+" Sanskrit anchor: '"+p.verse+"'. Graphic novel --ar 16:9 "+NEG+" --v 6.0";return '<div class="panel-row"><div class="panel-header"><span class="panel-seq">#0'+p.act+'</span> '+p.name+' '+p.rasa+'<span>'+p.bpm+' BPM · '+p.matras+' matra</span></div><div class="panel-body"><div><div class="dialogue-verse">'+p.verse+'</div><div class="dialogue-trans">'+p.translation+'</div><div class="meter-scansion">'+scan+'</div></div><div class="prompt-box"><div class="prompt-title-row"><span>Panel directive</span><button class="btn-copy" data-copy="'+encodeURIComponent(prompt)+'">Copy</button></div><div class="dialogue-trans">'+prompt+'</div></div></div></div>'}).join("");timelineStream.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(decodeURIComponent(b.dataset.copy)));this.renderPrompts()}renderPrompts(){const data=this.payload;let out="";if(this.tab==="asymmetric")out="/imagine prompt: Complete 5-panel sequential comic page for Global Signal #"+data.seed+" on "+data.date+". Composition: Asymmetric 5-box grid, two wide panels on the top tier and three on the bottom. Strictly five panels. No sixth cell. No duplicate acts. Panel 1 Setup Bhayanaka: "+data.panels[0].scene+" Panel 2 Rise Hasya: "+data.panels[1].scene+" Panel 3 Climax Karuna: "+data.panels[2].translation+" Panel 4 Decel Vira: "+data.panels[3].scene+" Panel 5 Settle Santa: "+data.panels[4].scene+" Graphic novel, bold ink --ar 16:9 "+NEG+" --v 6.0";else if(this.tab==="linear")out="/imagine prompt: Continuous 5-frame horizontal strip, one row of five panels. Frame 1 Bhayanaka: "+data.panels[0].scene+" Frame 2 Hasya: "+data.panels[1].scene+" Frame 3 Karuna: "+data.panels[2].translation+" Frame 4 Vira: "+data.panels[3].scene+" Frame 5 Santa: "+data.panels[4].scene+" --ar 32:9 --no vertical split, grid, second row, 6 frames, duplicate acts --v 6.0";else if(this.tab==="grok_json")out=JSON.stringify({system_id:"Global_Signals_Vedic_Matrix",verification_status:"L0_PASS",sync_date:data.date,active_seed:data.seed,display_tag:data.display_tag,layout_contract:{target_cells:5,forbidden_layouts:["2x3","3x2","6-box"],negative_prompt:"6-panel, 2x3 grid, sixth box, duplicate panel, repeated character, extra frame"},distribution:data.distribution,canonical_sequence:data.panels},null,2);else out="DAILY SIGNAL // "+data.date+" // "+data.display_tag+"\n\n"+data.headline+"\n\n"+data.panels.map(p=>"Act "+p.act+" ["+p.rasa+" | "+p.bpm+" BPM]: "+p.verse+" — "+p.translation).join("\n")+"\n\nSeed #"+data.seed+" L=0";txtFullPrompt.textContent=out}pulse(){const ctx=new (window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime+0.05;this.payload.panels.forEach(p=>{const beat=60/p.bpm;p.scansion.split("").forEach(ch=>{const g=ch==="G";const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=g?330:220;const dur=g?beat*0.85:beat*0.45;gain.gain.setValueAtTime(0.15,t);gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+dur);t+=dur+(g?beat*0.15:beat*0.55)});t+=beat*0.8});txtEngineStatus.textContent="Pulse Sa 220 / Pa 330"}exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(this.payload,null,2)],{type:"application/json"}));a.download="global_signal_"+this.date+".json";a.click()}}
document.addEventListener("DOMContentLoaded",()=>new Sync());
</script></body></html>
